name: Bootstrap reviewed PS3D source

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-reviewed-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ps3d-reviewed-source-import
  cancel-in-progress: false

jobs:
  import-reviewed-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out import commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify, extract, and commit the reviewed source
        shell: bash
        env:
          BUNDLE_FILE: ps3d-reviewed-source-fix2.zip
          BUNDLE_SHA256: a8fb36a9dbf4c03c18fe5ba05e3eaa93b166ba5ac86a7caeeed6be54880cdff4
          BUNDLE_ENTRY_COUNT: "284"
        run: |
          set -euo pipefail

          test -f "${BUNDLE_FILE}"
          printf '%s  %s\n' "${BUNDLE_SHA256}" "${BUNDLE_FILE}" | sha256sum --check --strict -

          actual_entry_count="$(unzip -Z1 "${BUNDLE_FILE}" | wc -l | tr -d '[:space:]')"
          test "${actual_entry_count}" = "${BUNDLE_ENTRY_COUNT}"

          unzip -Z1 "${BUNDLE_FILE}" | awk '
            /^\// { unsafe = 1 }
            /^[A-Za-z]:/ { unsafe = 1 }
            /(^|\/)\.\.(\/|$)/ { unsafe = 1 }
            /\\/ { unsafe = 1 }
            END { exit unsafe ? 1 : 0 }
          ' || { echo "Unsafe archive path rejected." >&2; exit 1; }

          unzip -o -q "${BUNDLE_FILE}"
          rm -f "${BUNDLE_FILE}"

          importer_copy="${RUNNER_TEMP}/bootstrap-reviewed-source.yml"
          mv .github/workflows/bootstrap-reviewed-source.yml "${importer_copy}"

          node scripts/verify-repository-boundary.mjs
          node scripts/verify-dependency-inventory.mjs
          node scripts/verify-source-identity.mjs
          node scripts/verify-generated-source-set.mjs

          # GitHub App tokens cannot modify workflow files. The authenticated
          # repository versions are restored after verification and excluded
          # from the bot-authored source correction commit.
          git restore --source=HEAD --staged --worktree -- .github/workflows

          git add --all
          if ! git diff --cached --quiet -- .github/workflows; then
            echo "Workflow changes must be committed through the authenticated web UI." >&2
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No reviewed source changes were staged." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: import reviewed PS3D 0.2.0 preview source"
          git push origin HEAD:main
